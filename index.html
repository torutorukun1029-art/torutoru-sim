<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>応募効果シミュレーター</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --navy:#1F3864; --line:#d6dbe3; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color:#222; }
  .wrap { max-width:680px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; color:var(--navy); margin:4px 0 12px; }
  label { display:block; font-size:13px; color:#555; margin:12px 0 4px; }
  textarea, input, select { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .chk { display:flex; align-items:center; gap:8px; font-size:15px; color:#222; margin-top:12px; }
  .chk input { width:auto; }
  textarea { min-height:140px; resize:vertical; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; font-size:17px; padding:14px; margin-top:14px; border:0; border-radius:10px; background:var(--navy); color:#fff; font-weight:bold; }
  button:disabled { background:#9aa5b8; }
  .link { background:none; color:var(--navy); font-weight:normal; font-size:13px; text-align:left; padding:6px 0; margin-top:6px; width:auto; text-decoration:underline; }
  #opt { display:none; }
  #status { margin-top:14px; font-size:15px; color:#555; min-height:1.4em; }
  #out { display:none; margin-top:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; font-size:16px; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
  #copy { background:#548235; }
  .small { font-size:12px; color:#888; margin-top:18px; }
  .hint { font-size:12px; color:#888; margin:2px 0 0 26px; }
</style></head>
<body><div class="wrap">
  <h1>応募効果シミュレーター</h1>
  <label for="src">求人原稿のURL／tldvのURL／原稿の本文（どれか1つ）</label>
  <textarea id="src" placeholder="ここに貼る"></textarea>
  <button class="link" type="button" id="toggle">広告費・期間・プラン・成果報酬を変更する（既定：月1万円・3ヶ月・プランと成果報酬は自動）</button>
  <div id="opt"><div class="row">
    <div><label for="ad">広告費（月・万円）</label><input id="ad" type="number" inputmode="decimal" placeholder="1"></div>
    <div><label for="months">期間（月数）</label><input id="months" type="number" inputmode="numeric" placeholder="3"></div>
  </div>
    <label for="plan">プラン</label>
    <select id="plan"><option value="">自動（資料から読み取り。無ければスタンダード）</option></select>
    <label class="chk"><input type="checkbox" id="byplan"> プラン別に並べる（数字の行をプランごとに出す）</label>
    <label class="chk"><input type="checkbox" id="seika"> 成果報酬の採用単価も出す</label>
    <div class="hint" id="seikahint">自動：資料に成果報酬・採用単価の話があればオン。職種が複数なら職種ごとに出します（最大6職種）</div>
  </div>
  <button type="button" id="go">文面を作る</button>
  <div id="status"></div>
  <div id="out"></div>
  <button type="button" id="copy" style="display:none">コピー</button>
  <div class="small">貼ってから10秒ほどで出ます（Indeed の URL は15秒ほど）。URL を読めないときは、原稿の本文を貼ってください。</div>
</div>
<script>
  // API（Google Apps Script の exec）。Cookie は送らない（credentials: 'omit'）。本文は JSON の文字列を text/plain のまま送る（プリフライト無し）
  // 本体 API（torutorukun1029 の単独 GAS。計算・文面・ログ・プラン一覧。外部通信の権限なし＝上限に当たらない。clasp でデプロイ）
  var API = 'https://script.google.com/macros/s/AKfycbw52LE0dOa1JyyGn41poI7UO4hOh9N2wYSGabVNH2mLCL0xGb7m8jroRZmteRmbiXdEUg/exec';
  // 前の GAS（シートに紐づいた版。取得・読み取り・計算を1つで行う）。読み取り係か本体 API が失敗したときだけ使う（外部通信の上限を共有するので最後の手段）
  var LEGACY = 'https://script.google.com/macros/s/AKfycbwTRNlORaEtLaZowQtJ75eL_9R40TKyuIyKuYLIv8jwnsOBQGXVGjDI3xNN7mcisVv8/exec';
  // 読み取り係（Cloudflare Worker。資料の取得と Claude の読み取りだけ。Google の外なので GAS の上限と無関係。wrangler でデプロイ）
  var READER = 'https://torutoru-sim-reader.torutoru-sim-reader.workers.dev';
  var $ = function (id) { return document.getElementById(id); };
  var MSG = { empty: '原稿の本文を貼ってください', nosource: 'URL を読めませんでした（掲載が終わっている・ページが開けないなど）。原稿の本文を貼ってください',
    nokey: '設定が足りません（Claude の API キーが入っていない）。管理者に連絡してください',
    ai: 'AI の読み取りに失敗しました（Claude の API の応答がエラー）。少し待って、もう一度試してください',
    quota: 'Google の1日の通信の上限に達していて、今は作れません（同じアカウントのほかの自動処理と共有の枠）。管理者に連絡してください',
    error: '文面を作れませんでした（裏の処理でエラー）。原稿の本文を貼って、もう一度試してください',
    net: '裏の処理につながりませんでした（通信エラーか時間切れ）。もう一度試してください' };
  function post(url, body, ms) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms || 70000) : null;
    return fetch(url, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (timer) clearTimeout(timer); return j; }, function (e) { if (timer) clearTimeout(timer); throw e; });
  }
  // 失敗を同じ形にそろえる（前の版の GAS は上限のエラーを reason 'ai' で返すので、中身で quota に直す）
  function fail(res, path) {
    var r = (res && res.reason) || 'error', d = String((res && res.detail) || '');
    if (/urlfetch|回数が多すぎます|too many times/i.test(d)) r = 'quota';
    return { ok: false, reason: r, detail: d, path: path };
  }
  function netFail(e, path) { return { ok: false, reason: 'net', detail: String(e && (e.name === 'AbortError' ? '時間切れ' : (e.message || e))), path: path }; }
  // 読み取り係 → API の compose。読み取り係が使えない（上限・エラー・通信）ときは、API だけで全部やる形に戻る
  function run(req) {
    var whole = function (first) {
      // 前の GAS も失敗したら、画面には最初の原因（読み取り係・本体 API）を出し、前の GAS の失敗は詳細とログに足す
      var both = function (f) { if (!first) return f; var g = { ok: false, reason: first.reason, detail: String(first.detail || '') + ' ／ 前の GAS：' + f.reason + ' ' + f.detail, path: first.path }; g.first = f; return g; };
      return post(LEGACY, req).then(function (res) { if (res && res.ok) { res.path = '前の GAS'; return res; } return both(fail(res, '前の GAS')); },
        function (e) { return both(netFail(e, '前の GAS')); });
    };
    if (!READER) return whole(null);
    return post(READER, { action: 'read', src: req.src }).then(function (rd) {
      if (!rd || !rd.ok) {
        var f = fail(rd, '読み取り係');
        if (f.reason === 'empty' || f.reason === 'nosource') return f;
        return whole(f);
      }
      var c = {}; Object.keys(req).forEach(function (k) { c[k] = req[k]; }); c.action = 'compose'; c.read = rd;
      return post(API, c).then(function (res) { if (res && res.ok) { res.path = '読み取り係＋本体 API'; return res; } return whole(fail(res, '本体 API の計算')); },
        function (e) { return whole(netFail(e, '本体 API の計算')); });
    }, function (e) { return whole(netFail(e, '読み取り係')); });
  }
  // ログは本体 API に書く（シートの操作だけ）。だめなら前の GAS（どちらも同じシートの「ログ」タブ）
  function postLog(log) {
    return post(API, { action: 'log', log: log }, 30000).then(function (r) { if (!r || !r.ok) throw new Error('log'); }).catch(function () { return post(LEGACY, { action: 'log', log: log }, 30000).catch(function () {}); });
  }
  function jst() { try { return new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false }); } catch (e) { return String(new Date()); } }
  // 失敗もログに1行（ログを書くのは API。シートの操作だけなので通信の上限には当たらない）
  function logFail(req, f) {
    var memo = '失敗：' + f.reason + '（' + (MSG[f.reason] || '') + '）\n経路：' + (f.path || '') + '\n詳細：' + f.detail.slice(0, 500) +
      (f.first ? '\nほかに試した経路：' + f.first.path + '／' + f.first.reason + '／' + String(f.first.detail || '').slice(0, 300) : '') +
      '\n画面：' + navigator.userAgent.slice(0, 150);
    try { postLog({ at: jst(), src: String(req.src || '').slice(0, 3000), ad: req.ad, months: req.months, text: '（失敗）', memo: memo, model: '', sources: '', warnings: '', evidence: '' }); } catch (e) {}
  }
  // プランの選択肢（マスタから）。取れるまでは「自動」だけ
  var getPlans = function (base) { return fetch(base + '?action=plans', { credentials: 'omit', redirect: 'follow' }).then(function (r) { return r.json(); }); };
  getPlans(API).then(function (j) { return (j && j.ok) ? j : getPlans(LEGACY); }, function () { return getPlans(LEGACY); }).then(function (j) {
    if (!j || !j.ok || !j.plans) return;
    var sel = $('plan');
    j.plans.forEach(function (p) { var o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
  }).catch(function () {});
  // 成果報酬のチェック：触るまでは「自動」（資料の読み取りで決まる）。手で切り替えたら、その値を優先する
  var seikaManual = false;
  $('seika').onchange = function () { seikaManual = true; $('seikahint').textContent = '手動：' + ($('seika').checked ? 'オン' : 'オフ') + '（資料の読み取りより優先）'; };
  $('toggle').onclick = function () { var o = $('opt'); o.style.display = o.style.display === 'block' ? 'none' : 'block'; };
  $('go').onclick = function () {
    var src = $('src').value.trim();
    if (!src) { $('status').textContent = MSG.empty; return; }
    var open = $('opt').style.display === 'block';
    var req = { src: src, ad: open ? $('ad').value : '', months: open ? $('months').value : '', plan: open ? $('plan').value : '', byPlan: open ? $('byplan').checked : false,
      seika: (open && seikaManual) ? $('seika').checked : null };
    $('go').disabled = true; $('status').textContent = '作成中…'; $('out').style.display = 'none'; $('copy').style.display = 'none';
    run(req).then(function (res) {
      $('go').disabled = false;
      if (!res || !res.ok) {
        var f = res || { reason: 'error', detail: '' };
        $('status').innerHTML = '';
        $('status').appendChild(document.createTextNode(MSG[f.reason] || MSG.error));
        if (f.detail) { var d = document.createElement('div'); d.className = 'small'; d.textContent = '原因：' + f.detail.slice(0, 140); $('status').appendChild(d); }
        if (window.console) console.log(f);
        logFail(req, f);
        return;
      }
      $('status').textContent = res.note || '';
      if (!seikaManual && typeof res.seika === 'boolean') $('seika').checked = res.seika;   // 自動で決まった状態を見せる（手動にはしない）
      $('out').textContent = res.text; $('out').style.display = 'block'; $('copy').style.display = 'block';
      try { postLog(res.log); } catch (e) {}
    });
  };
  $('copy').onclick = function () {
    var t = $('out').textContent;
    var done = function () { $('copy').textContent = 'コピーしました'; setTimeout(function () { $('copy').textContent = 'コピー'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(done, function () { fallback(); }); } else { fallback(); }
    function fallback() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(ta); }
  };
</script></body></html>
